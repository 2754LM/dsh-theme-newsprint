# dsh-theme-newsprint profile patch layer — insert one loader entry for
# the plugin package. No dsh.client block: this plugin is the cordis-shim
# form (see lib/index.js for the rationale). dshmarket recognises the
# entry as a theme by matching against the awesome-dsh-plugin registry
# and toggles its `disabled` flag on activate / deactivate.
- insert:
    - id: newsprint
      name: 'dsh-theme-newsprint'
